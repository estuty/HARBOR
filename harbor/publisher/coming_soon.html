<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Coming soon</title>
<meta name="description" content="{{ tagline }}">
<style>
  :root { --accent: {{ accent }}; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
         font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #f4f1ea;
         background: radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--accent) 45%, #111) 0%, #101418 60%); }
  main { max-width: 640px; }
  .tag { display: inline-block; font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid rgba(255,255,255,.35); padding: 6px 14px; border-radius: 99px; }
  h1 { font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1; letter-spacing: -0.035em; margin: 26px 0 16px; }
  p { color: rgba(244,241,234,.75); font-size: 1.15rem; }
  a { color: #fff; }
  .links { margin-top: 30px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <span class="tag">Coming soon</span>
  <h1>{{ title }}</h1>
  {% if tagline %}<p>{{ tagline }}</p>{% endif %}
  {% if description %}<p>{{ description }}</p>{% endif %}
  <div class="links">
    {% if email %}<a href="mailto:{{ email }}">{{ email }}</a>{% endif %}
    {% for name, url in links %}<a href="{{ url }}" rel="noopener">{{ name }}</a>{% endfor %}
  </div>
</main>
</body>
</html>
