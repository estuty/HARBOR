<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor sign-in · Harbor</title>
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-body">
<form class="login card" method="post" action="/login/2fa">
  <div class="brand big">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 10v17M9 15h14M5 19c1 5 5.5 8 11 8s10-3 11-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>Harbor</span>
  </div>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  <p class="muted center">Enter the 6-digit code from your authenticator app.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="20" class="code-input" placeholder="123 456"></label>
  <button class="btn primary wide">Verify</button>
  <p class="muted small center">Lost your phone? Enter one of your recovery codes instead.<br><a href="/login">Start over</a></p>
</form>
</body>
</html>
